name: Java Application CI

# --------------------------------------------------
# Триггеры
# --------------------------------------------------
on:
  push:
    branches:
      - main
      - "feature/**"

  # Вариант 14 (часть 2): автоматический контроль качества при Pull Request
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      run_docker:
        description: 'Run optional Docker build and smoke test'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  # Нужно, чтобы status check был виден на PR
  checks: write
  pull-requests: write

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==================================================
  # Контроль качества (Quality Gate)
  # Обязателен для push и для Pull Request
  # ==================================================
  quality-gate:
    name: Quality Gate (build + tests)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show toolchain
        shell: pwsh
        run: |
          java -version
          mvn -version
          git --version
          Write-Host "Event: ${{ github.event_name }}"
          Write-Host "Ref: ${{ github.ref }}"

      - name: Build and verify (unit + integration tests)
        shell: pwsh
        run: mvn -B -ntp clean verify

      - name: Generate Surefire HTML report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'target/surefire-reports') {
            mvn -B -ntp surefire-report:report-only
          } else {
            Write-Host 'Surefire reports are absent.'
          }

      - name: Generate JaCoCo HTML report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'target/jacoco.exec') {
            mvn -B -ntp jacoco:report
          } else {
            Write-Host 'JaCoCo execution data is absent.'
          }

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/surefire-report.html
            target/site/jacoco/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-jar
          path: target/task-manager-cicd-*.jar
          if-no-files-found: error
          retention-days: 7

      # Явная фиксация результата Quality Gate (удобно для PR Checks)
      - name: Quality Gate summary
        if: always()
        shell: pwsh
        run: |
          if ("${{ job.status }}" -eq "success") {
            Write-Host "QUALITY GATE PASSED: tests and build succeeded."
            Write-Host "Pull Request can be considered ready for review (from CI perspective)."
          } else {
            Write-Host "QUALITY GATE FAILED: build or tests did not pass."
            Write-Host "Pull Request must NOT be merged until the issues are fixed."
            exit 1
          }

  # ==================================================
  # Доп. job только для Pull Request (вариант 14)
  # Показывает, что контроль качества привязан к PR
  # ==================================================
  pr-quality-control:
    name: PR Quality Control
    if: github.event_name == 'pull_request'
    needs: quality-gate
    runs-on: windows-latest

    steps:
      - name: PR quality control status
        shell: pwsh
        run: |
          Write-Host "=== Automatic Quality Control for Pull Request ==="
          Write-Host "PR number : ${{ github.event.pull_request.number }}"
          Write-Host "Title     : ${{ github.event.pull_request.title }}"
          Write-Host "Head ref  : ${{ github.head_ref }}"
          Write-Host "Base ref  : ${{ github.base_ref }}"
          Write-Host "Quality Gate job completed successfully (needs: quality-gate)."
          Write-Host "All required checks for this PR have passed."

  # ==================================================
  # Необязательный Docker (как в методичке)
  # ==================================================
  docker-build-smoke-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker }}
    name: Build and smoke-test Linux image
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t task-manager-cicd:ci .
